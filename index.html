function render(){$('threads').textContent=state?.pending?.length?'未了因缘 '+state.pending.length+' 桩':'';$('location').textContent=state?state.location:'命运尚未落笔';$('year').textContent=state?formatYear(currentYear(state)):'—';$('day').textContent=state?'第 '+state.day+' 日 · '+state.turn+' 次抉择':'第 — 日';$('identity').textContent=state?state.identity+' · '+genderName(state.gender)+' · '+state.epoch:'等待一位异乡人';$('actions').textContent=state?'行动力 '+state.ap+' / 3 · '+(state.phase==='daily'?'城镇生活':'年度抉择'):'行动力 —';$('bag').textContent=state?'行囊 '+Object.values(state.inventory).reduce((a,b)=>a+b,0)+' 件 · '+state.currency+(state.inventory.jade?' · 玉佩气运 +10':''):'行囊为空';$('stats').innerHTML=Object.entries(LABELS).map(([k,n])=>'<div class="stat" data-stat="'+k+'"'+(k==='wealth'&&state?' title="通货：'+escapeHTML(state.currency)+'"':'')+'>'+n+'<span class="stat-value">'+(state?effectiveStat(k):'—')+'</span></div>').join('');if(state&&state.stats.health<=25)$('stats').querySelector('[data-stat=health]').classList.add('is-critical');const currentStats=state&&Object.fromEntries(Object.keys(LABELS).map(k=>[k,effectiveStat(k)]));if(currentStats&&renderedStats&&renderedHistory===state.history)for(const k of Object.keys(LABELS))if(currentStats[k]!==renderedStats[k]){const card=$('stats').querySelector('[data-stat='+k+']');card.classList.add('is-changed',currentStats[k]>renderedStats[k]?'is-gain':'is-loss')}renderedStats=currentStats;renderedHistory=state?.history;$('market').disabled=!canUseBag();for(const id of ['jobs','family'])$(id).disabled=!canAct();renderChoices()}
function renderChoices(){const area=$('choices');area.replaceChildren();if(!state||state.status==='ended'){const b=document.createElement('button');b.className='option primary';b.textContent='开启新的轮回 →';b.onclick=requestNew;area.append(b);return}if(state.status!=='alive')return;if(state.phase==='daily'){const b=document.createElement('button');b.className='option primary';b.textContent='推进命运 · 进入下一年 →';b.style.gridColumn='1 / -1';b.disabled=busy;b.onclick=advanceYear;area.append(b);return}activeEvent().options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';if(o.adUnlock||o.test||o.require)b.dataset.mark=o.adUnlock?'天选':o.test?'检定':'门槛';let unmet=o.require&&Object.entries(o.require).some(([k,v])=>effectiveStat(k)<v);const insufficient=o.effect?.wealth<0&&state.stats.wealth < -o.effect.wealth;b.disabled=!!unmet||insufficient||busy;const text=document.createElement('span');text.textContent=o.text;b.append(text);const small=document.createElement('small');small.textContent=insufficient?'盘缠不足 · 需要 '+amount(-o.effect.wealth):o.adUnlock?'✧ 模拟广告 3 秒 · 本次选项解锁':o.test?'检定：'+LABELS[o.test]+' · 成功率 '+chance(effectiveStat(o.test))+'%':o.require?'需要 '+Object.entries(o.require).map(([k,v])=>LABELS[k]+' ≥ '+v).join('、'):Object.entries(o.effect||{}).map(([k,v])=>LABELS[k]+(v>0?' +':' ')+v).join(' · ');b.append(small);b.onclick=()=>o.adUnlock?advert(()=>choose(i),'解锁命运选项'):choose(i);area.append(b)})}
function chance(value){return Math.max(10,Math.min(95,Math.round(value*.8+effectiveStat('luck')*.2)))}
function effects(effect,disease=false,attack=false){let changes=[];for(const [k,v] of Object.entries(effect||{})){if(!Object.hasOwn(LABELS,k))continue;let d=v;if(k==='health'&&d<0)d*=epochOf().damageMultiplier;if(k==='health'&&d<0&&disease&&state.talents.includes('antibody'))d=Math.ceil(d/2);if(k==='prestige'&&d>0&&state.talents.includes('stranger'))d=Math.floor(d*.75);const before=state.stats[k];if(k==='health'&&d<0&&attack&&before+d<=0&&state.inventory.dagger){state.inventory.dagger--;d=1-before;log('notice','【防身匕首】消耗一把，挡下致命袭击，保留 1 健康。')}state.stats[k]=Math.max(0,Math.min(k==='wealth'?Number.MAX_SAFE_INTEGER:100,before+d));const diff=state.stats[k]-before;if(diff)changes.push(LABELS[k]+(diff>0?' +':' ')+diff)}if(changes.length)log('notice','【属性变动】'+changes.join(' · '))}
function start(){const life=generateHumanLife(),pool=[...TALENTS];for(let i=pool.length-1;i>0;i--){const j=rand(0,i);[pool[i],pool[j]]=[pool[j],pool[i]]}const talents=pool.slice(0,rand(1,2)).map(t=>t.id);state={version:2,era:life.epochId,epochId:life.epochId,epoch:life.epoch,regionId:life.regionId,year:life.year,location:life.location,currency:life.currency,identity:life.identity,gender:life.gender,eventVariant:null,pending:[],recentEvents:[],talents,stats:Object.fromEntries(Object.keys(LABELS).map(k=>[k,life[k]])),day:1,turn:0,eventId:life.epochId+'_1',destinyAt:rand(3,5),history:[],status:'alive',revivals:0,phase:'daily',ap:3,inventory:read('time-drifter-heirloom')?{jade:1}:{},family:familyFor(life.identity)};if(talents.includes('chosen'))state.stats.luck=Math.min(100,state.stats.luck+20);clearJournal();log('intro',formatYear(state.year)+' · '+state.location+'\n'+epochOf().tone+'\n你以「'+state.identity+'」的身份醒来。通货：'+state.currency+'。\n天赋：'+talents.map(t=>{const x=TALENTS.find(x=>x.id===t);return x.name+'（'+x.detail+'）'}).join('、')+'\n家庭：'+state.family.name+'。每年有 3 点行动力，日常生活结束后再推进命运。','此身落在何处',annualArt(state.year));autoSave();render()}
function requestNew(){if(busy)return;if(state&&state.status!=='ended'){showModal('开启新的轮回','当前进度将被新的自动存档覆盖。手动槽位中的存档会保留。',[['先保存到槽位',()=>slots('save')],['开启轮回',()=>{close();start()}],['返回',close]])}else start()}
function showEvent(){let e=eventById(state.eventId);if((e.inspection||e.id.endsWith('_1'))&&state.inventory.papers){state.inventory.papers--;log('notice','【通关文牒】自动消耗一份，盘查获准豁免。');state.eventId=e.options[0].nextId;e=eventById(state.eventId)}state.eventVariant=e.variants?.find(v=>matchesLife(v.when))?.id||null;e=activeEvent();state.recentEvents.push(e.id);state.recentEvents=state.recentEvents.slice(-5);log('event',e.description,e.title,e)}
function advanceYear(acceptLoss=false){if(!canAct())return;if(state.family.condition==='ill'&&acceptLoss!==true){showModal('家人仍在病中','尚未寻医便推进下一年，重病长辈将离世。救治需要 80 份当地通货和 1 点行动力。',[['先查看家庭',()=>{close();familyPanel()}],['仍然推进下一年',()=>{close();advanceYear(true)}],['返回',close]]);return;}state.day+=365;foldOlderYears();state.ap=3;state.phase='event';log('intro',state.location+'的晨光再次照进窗棂。旧事已成墨迹，新的一年正待你落笔。行动力恢复至 3。',formatYear(currentYear(state))+' · 岁序更替',annualArt(currentYear(state)));let income=0;for(const item of ITEMS)if(item.type==='asset')income+=(state.inventory[item.id]||0)*item.income;if(income){log('notice','【资产收益】田产与铺面带来 '+amount(income));effects({wealth:income})}const f=state.family;if(f.condition==='ill'){f.condition='deceased';log('event','你未能及时为重病长辈寻医，他们离开了人世。家中只余旧物与未说完的话。','家中噩耗')}else if(f.condition==='well'&&state.turn>=2&&Math.random()<.25){f.condition='ill';log('event','长辈年迈重病，急需 '+amount(80)+' 延医。处理年度抉择后，可在家庭页寻医；再次推进一年仍未治疗，长辈将离世。','家书告急')}resolveAftermath();if(state.stats.health>0){state.eventId=drawAnnualEvent();showEvent()}changed()}
function choose(i){if(busy||state.status!=='alive')return;if(state.phase!=='event')return;const event=activeEvent(),o=event.options[i];if(o.effect?.wealth<0&&state.stats.wealth < -o.effect.wealth)return;if(o.require&&Object.entries(o.require).some(([k,v])=>effectiveStat(k)<v))return;busy=true;log('choice','你的选择：'+o.text);let result=o;if(o.test){const roll=rand(1,100),ok=roll<=chance(effectiveStat(o.test));log('notice','【'+(o.test==='luck'?'气运':'属性')+'检定】'+(ok?'成功':'失败')+' · 掷骰 '+roll+' / 门槛 '+chance(effectiveStat(o.test))+(roll>=96&&!ok?' · 大失败':''));result=ok?o.success:o.fail;effects(result,o.disease,event.attack||event.id.endsWith('_6'));if(roll>=96&&!ok)effects({health:-10},false,event.attack)}else effects(o.effect,o.disease,event.attack);if(state.stats.health>0)scheduleAftermath(result.aftermath||o.aftermath);state.eventId=result.nextId||o.nextId;state.eventVariant=null;state.turn++;if(state.stats.health>0&&state.turn>=state.destinyAt){state.destinyAt=state.turn+rand(3,5);if(Math.random()<.65){const good=Math.random()<(effectiveStat('luck')+20)/140;const d=pick(DESTINY.slice(good?0:3,good?3:6));log('event','【天选事件 · '+(good?'大吉':'厄运')+'】'+d.description,d.title,d);effects(d.effect,d.disease,d.attack)}}state.phase='daily';if(state.stats.health<=0)state.status='dying';else log('notice','年度抉择已落定。你可以在城镇生活，再推进下一年。');busy=false;autoSave();render();if(state.status==='dying')death()}
function showModal(title,text,actions){const m=$('modal');m.classList.remove('life-panel');m.replaceChildren();const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=text;p.style.lineHeight='1.9';m.append(h,p);actions.forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;m.append(b)});if(!m.open)m.showModal()}
function close(){$('modal').close()}
function advert(done,title){if(busy)return;busy=true;renderChoices();let remaining=3;showModal(title,'模拟广告播放中 · 3 秒',[]);const interval=setInterval(()=>{remaining--;if(remaining>0)$('modal').querySelector('p').textContent='模拟广告播放中 · '+remaining+' 秒';else{clearInterval(interval);busy=false;close();done();render()}},1000)}
function death(){showModal('命悬一线','你的健康已经归零。这段漂泊尚未结束，命运愿意给你另一次机会。',[['看广告 · 现代医学奇迹',()=>advert(()=>{state.stats.health=60;state.status='alive';state.revivals++;log('notice','【现代医学奇迹】疾病与伤势消退，健康恢复至 60。');if(state.phase==='event')showEvent();autoSave();render()},'时光回溯')],['接受命运 · 生平总结',()=>{close();finish()}]])}
function finish(){state.status='ended';const a=[];if(state.day>=30)a.push('长路幸存者');if(state.stats.wealth>=100)a.push('富甲一方');if(state.stats.prestige>=60)a.push('青史留名');if(state.stats.intellect>=80)a.push('先知之智');if(state.revivals)a.push('逆天改命');if(!a.length)a.push('异乡初梦');log('intro','你在'+state.location+'，以'+state.identity+'之身走过 '+state.day+' 日，做出 '+state.turn+' 次抉择。\n'+(state.stats.prestige>=60?'你的名字被人们传诵，成了街巷间的一段传奇。':state.stats.wealth>=100?'你从陌生街角起步，积攒的财富见证了漂泊者的胆识。':'史书没有写下你的名字，但每一次求生，都曾让这个时代泛起微光。')+'\n达成成就：'+a.join(' · ')+'\n复活次数：'+state.revivals,'轮回终章 · 遗客生平');autoSave();render()}
function restore(s){if(!valid(s)){toast('存档损坏或版本不兼容');return}state=structuredClone(migrate(s));if(state.inventory.jade)write('time-drifter-heirloom',true);if(read('time-drifter-heirloom'))state.inventory.jade=1;clearJournal();state.history.forEach(h=>append(h,false));foldOlderYears();close();render();autoSave();toast('已恢复第 '+state.day+' 日的进度');if(state.status==='dying')death()}
function exportSave(){if(!state||!valid(snapshot())){toast('当前没有可导出的旅途');return}const url=URL.createObjectURL(new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='time-drifter-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('存档文件已生成，请保管好')}
async function importSaveFile(file){if(!file)return;if(file.size>5*1024*1024){toast('存档文件超过 5MB，无法读取');return}let imported;try{imported=JSON.parse(await file.text())}catch{toast('无法读取存档，请选择本游戏导出的 JSON 文件');return}if(!valid(imported)){toast('存档损坏或版本不兼容');return}const s=migrate(imported);showModal('恢复这段旅途？',s.location+' · '+formatYear(currentYear(s))+' · 第 '+s.day+' 日。导入会替换当前自动进度，手动槽位保留。',[['确认导入',()=>restore(s)],['返回',()=>slots('load')]])}
function saveTransferControls(parent){const row=document.createElement('div');row.className='slot';const note=document.createElement('p');note.textContent='换浏览器或切换到正式试玩网址前，可导出文件备份，再在新网址导入。';const output=document.createElement('button');output.textContent='导出当前旅途';output.disabled=!state;output.onclick=exportSave;const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.hidden=true;input.onchange=()=>importSaveFile(input.files[0]);const load=document.createElement('button');load.textContent='导入存档文件';load.onclick=()=>{input.value='';input.click()};row.append(note,output,load,input);parent.append(row)}

function slots(mode){if(busy)return;const m=$('modal');m.classList.remove('life-panel');m.replaceChildren();const h=document.createElement('h2');h.textContent=mode==='save'?'将此刻封入书页':'重返旧日时空';m.append(h);const keys=mode==='load'?['auto','1','2','3']:['1','2','3'];keys.forEach(n=>{const s=read('time-drifter-'+n),v=valid(s),row=document.createElement('div');row.className='slot';const title=document.createElement('strong');title.textContent=n==='auto'?'自动存档':'存档槽位 '+n;const p=document.createElement('p');p.textContent=v?migrate(s).location+' · '+formatYear(currentYear(migrate(s)))+' · 第 '+s.day+' 日 · '+s.identity+'\n'+(s.savedAt?new Date(s.savedAt).toLocaleString('zh-CN'):'未知时间'):s?'存档不可用':'空白书页';const b=document.createElement('button');b.textContent=mode==='save'?(s?'覆盖此槽位':'保存到此槽位'):'读取';b.disabled=mode==='save'?!state:!v;b.onclick=()=>{if(mode==='load')restore(s);else if(s){showModal('覆盖存档','确认覆盖槽位 '+n+' 的旧进度？',[['确认覆盖',()=>{if(write('time-drifter-'+n,snapshot())){toast('已保存到槽位 '+n);slots(mode)}}],['返回',()=>slots(mode)]])}else if(write('time-drifter-'+n,snapshot())){toast('已保存到槽位 '+n);slots(mode)}};row.append(title,p,b);m.append(row)});saveTransferControls(m);const back=document.createElement('button');back.textContent='返回';back.onclick=close;m.append(back);if(!m.open)m.showModal()}
// 生活界面使用同一份 state；新增商品、工作只需扩充 ITEMS / JOBS。
function panel(title,intro){const m=$('modal');m.replaceChildren();m.classList.add('life-panel');const head=document.createElement('div');head.className='panel-head';const h=document.createElement('h2');h.textContent=title;const back=document.createElement('button');back.textContent=state?.phase==='event'?'返回事件':'返回城镇';back.onclick=close;head.append(h,back);const body=document.createElement('div');body.className='panel-body';const p=document.createElement('p');p.textContent=intro;body.append(p);m.append(head,body);m.scrollTop=0;if(!m.open)m.showModal();return body}
function card(parent,title,description,actions){const row=document.createElement('div');row.className='card';const h=document.createElement('strong');h.textContent=title;const p=document.createElement('p');p.textContent=description;row.append(h,p);for(const a of actions){const b=document.createElement('button');b.textContent=a.text;b.disabled=!!a.disabled;b.onclick=a.run;row.append(b)}parent.append(row)}
function purchase(id){if(!canAct())return;const item=ITEMS.find(i=>i.id===id);if(!item?.price||state.stats.wealth<item.price||item.type==='asset'&&state.inventory[id])return;effects({wealth:-item.price});state.inventory[id]=(state.inventory[id]||0)+1;log('notice','【购入】'+item.name+'，花费 '+amount(item.price));changed();marketPanel()}
function sellItem(id){if(!canAct()||!state.inventory[id])return;const item=ITEMS.find(i=>i.id===id);if(!item?.price)return;state.inventory[id]--;const price=Math.floor(item.price/2);effects({wealth:price});log('notice','【售出】'+item.name+'，收回 '+amount(price));changed();marketPanel()}
function useItem(id){if(!canUseBag()||!state.inventory[id])return;const item=ITEMS.find(i=>i.id===id);if(item?.type!=='consumable')return;state.inventory[id]--;log('notice','【使用】'+item.name);effects(item.effect);changed();marketPanel()}
function marketPanel(){if(!canUseBag())return;const m=panel('行囊与集市',state.location+' · 可用 '+amount(state.stats.wealth)+'。'+(state.phase==='event'?'当前正在年度抉择：点击顶部「返回事件」，完成 A/B/C/D 选择后即可买卖。已持有道具仍可使用。':'当前可自由买卖，购买和使用道具不消耗行动力。')+'资产每种限购一份。');card(m,'你的行囊',ITEMS.filter(i=>state.inventory[i.id]).map(i=>i.name+' ×'+state.inventory[i.id]).join('、')||'尚无物品。',[]);for(const item of ITEMS){const count=state.inventory[item.id]||0,actions=[];if(item.price)actions.push({text:!canAct()?'先完成年度抉择':item.type==='asset'&&count>0?'已拥有此资产':state.stats.wealth<item.price?'盘缠不足 · 需 '+item.price:'购买 · '+item.price,disabled:!canAct()||state.stats.wealth<item.price||item.type==='asset'&&count>0,run:()=>purchase(item.id)});if(count&&item.type==='consumable')actions.push({text:'使用',run:()=>useItem(item.id)});if(count&&item.price)actions.push({text:canAct()?'出售 · '+Math.floor(item.price/2):'抉择完成后可出售',disabled:!canAct(),run:()=>sellItem(item.id)});card(m,item.name+' · 持有 '+count,item.description+(item.price?' 价格：'+amount(item.price)+'。':''),actions)}}
function meetsJob(job){return !job.require||Object.entries(job.require).every(([k,v])=>effectiveStat(k)>v)}
function workJob(id){if(!canAct()||state.ap<1)return;const job=JOBS.find(j=>j.id===id);if(!job||!meetsJob(job))return;state.ap--;let pay=rand(...job.pay);if(id==='perform')pay+=Math.floor(effectiveStat('luck')/5);log('choice','【生计打工】'+job.name+'，行动力 -1');effects({health:-job.health,wealth:pay,prestige:job.prestige||0});const roll=Math.random();if(roll<job.risk){if(job.loss){log('notice','【遭到驱赶】生意被打断，损失盘缠。');effects({wealth:-job.loss})}else{const fatal=job.fatalRisk&&roll<job.fatalRisk;log('notice',fatal?'【护送遇袭】遭遇致命伏击！':'【工作受伤】意外令你付出了代价。');effects({health:fatal?-100:-job.injury,luck:-(job.luckLoss||0)},false,id==='escort')}}changed();if(canAct())jobsPanel()}
function jobsPanel(){if(!canAct())return;const m=panel('生计打工','行动力 '+state.ap+' / 3 · 所有工作消耗 1 点行动力。报酬使用 '+state.currency+'。'+(state.epochId==='PRIMITIVE'?'原始时代所有健康损耗翻倍。':''));for(const job of JOBS)card(m,job.name,job.description+(job.id==='perform'?' 当前额外报酬 +'+Math.floor(effectiveStat('luck')/5)+'。':''),[{text:!meetsJob(job)?'属性未达门槛':state.ap<1?'行动力不足':'开始打工',disabled:!meetsJob(job)||state.ap<1,run:()=>workJob(job.id)}])}
function familyAction(action){if(!canAct()||state.ap<1||state.family.condition==='deceased')return;const f=state.family;if(action==='visit'){if(state.stats.wealth<8)return;state.ap--;effects({wealth:-8});f.affinity=Math.min(100,f.affinity+12);log('choice','【尽孝请安】你带回食物与点心，亲密度 +12。')}else if(action==='help'){state.ap--;if(f.poor||f.affinity<55){f.affinity=Math.max(0,f.affinity-5);log('choice','【家庭求助】'+(f.poor?'家中已无余钱，长辈叹息着劝你自立。':'长辈斥你“不肖子孙”，亲密度 -5。'))}else{const money=rand(15,30);effects({wealth:money});f.affinity=Math.max(0,f.affinity-8);log('choice','【家庭资助】获得 '+amount(money)+'，亲密度 -8。')}}else if(action==='heal'){if(f.condition!=='ill'||state.stats.wealth<80)return;state.ap--;effects({wealth:-80});f.condition='well';f.affinity=Math.min(100,f.affinity+25);log('event','你花费盘缠延请医者，长辈终于转危为安。他们把珍藏的祖传玉佩交到你手里。','家人康复');if(!state.inventory.jade){state.inventory.jade=1;write('time-drifter-heirloom',true);log('notice','【祖传玉佩】被动气运 +10，后续轮回仍保留。')}}changed();if(canAct())familyPanel()}
function familyPanel(){if(!canAct())return;const f=state.family,m=panel('家庭与人脉','行动力 '+state.ap+' / 3 · '+f.name+' · 亲密度 '+f.affinity+' / 100 · '+(f.poor?'家境贫困':'家有薄蓄')+' · '+({well:'家人安好',ill:'长辈重病',deceased:'长辈已故'}[f.condition]));card(m,'家书与牵挂',f.background,[]);if(f.condition==='deceased'){card(m,'故人已逝','你可以继续生活，带着他们的嘱托走向下一年。',[]);return}const disabled=state.ap<1;card(m,'请安与尽孝','花费 '+amount(8)+' 与 1 点行动力，亲密度 +12。',[{text:disabled?'行动力不足':state.stats.wealth<8?'盘缠不足 · 需 8':'买点心请安',disabled:disabled||state.stats.wealth<8,run:()=>familyAction('visit')}]);card(m,'开口求助','消耗 1 点行动力。亲密度 ≥55 且家境不贫困时，获得 15–30 盘缠，亲密度 -8；否则被拒，亲密度 -5。',[{text:disabled?'行动力不足':'向长辈求助',disabled,run:()=>familyAction('help')}]);if(f.condition==='ill')card(m,'长辈年迈重病','花费 '+amount(80)+' 与 1 点行动力，救活长辈、亲密度 +25，并获得玉佩。未治疗便推进下一年，长辈将离世。',[{text:disabled?'行动力不足':state.stats.wealth<80?'盘缠不足 · 需 80':'延医救治',disabled:disabled||state.stats.wealth<80,run:()=>familyAction('heal')}])}

// 音乐由本项目合成；VO 使用设备中文语音，默认关闭。
const Sound={
 settings:{music:false,effects:false,voice:false,...read('time-drifter-sound')},
 music:new Audio('assets/audio/drifter-theme.wav'),unlocked:false,voiceTimer:0,effects:[],
 init(){this.music.loop=true;this.music.volume=.2;this.music.preload='none';
  document.addEventListener('click',e=>{if(!this.unlocked){this.unlocked=true;this.sync()}if(e.target.closest('button')&&e.target.id!=='sound')this.effect('choice')});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){this.music.pause();this.cancelVoice();this.effects.forEach(a=>a.pause());this.effects=[]}else this.sync()})},
 sync(){if(this.settings.music&&this.unlocked&&!document.hidden){if(this.music.paused)this.music.play().catch(()=>toast('音乐暂未播放，请再点击一次声音设置'))}else this.music.pause()},
 effect(name){if(!this.settings.effects||!this.unlocked||document.hidden)return;const a=new Audio('assets/audio/'+name+'.wav');a.volume=.3;this.effects.push(a);a.onended=()=>this.effects=this.effects.filter(x=>x!==a);a.play().catch(()=>{this.effects=this.effects.filter(x=>x!==a)})},
 cancelVoice(){clearTimeout(this.voiceTimer);if('speechSynthesis' in window)speechSynthesis.cancel();this.music.volume=.2},
 scene(title,text){this.effect('page');this.cancelVoice();if(!this.settings.voice||!this.unlocked||!('speechSynthesis' in window))return;
  this.voiceTimer=setTimeout(()=>{if(document.hidden||!this.settings.voice)return;const u=new SpeechSynthesisUtterance(title+'。'+text.slice(0,110));u.lang='zh-CN';u.rate=.88;u.volume=.8;const voice=speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang));if(voice)u.voice=voice;this.music.volume=.07;u.onend=u.onerror=()=>{this.music.volume=.2};speechSynthesis.speak(u)},1300)},
 toggle(key){this.unlocked=true;this.settings[key]=!this.settings[key];write('time-drifter-sound',this.settings);if(key==='voice'&&!this.settings.voice)this.cancelVoice();if(key==='effects'&&!this.settings.effects){this.effects.forEach(a=>a.pause());this.effects=[]}this.sync();soundPanel();if(key==='voice'&&this.settings.voice)this.scene('一梦千年','没有归途的地图，也没有注定的结局。你的旅途，由此开始。')}
};
function soundPanel(){if(busy){toast('请等待当前模拟广告播放完毕');return}showModal('声音与旁白','轻声伴读，随时可关。旁白采用设备中文语音，音色随手机而异。',[
 ['背景音乐 · '+(Sound.settings.music?'开':'关'),()=>Sound.toggle('music')],
 ['行动音效 · '+(Sound.settings.effects?'开':'关'),()=>Sound.toggle('effects')],
 ['中文旁白 · '+(Sound.settings.voice?'开':'关'),()=>Sound.toggle('voice')],
 ['返回',close]]);if(!('speechSynthesis' in window)){$('modal').querySelectorAll('button')[2].disabled=true;$('modal').querySelector('p').textContent+=' 当前浏览器不支持旁白。'}}
Sound.init();$('sound').onclick=soundPanel;

$('market').onclick=marketPanel;$('jobs').onclick=jobsPanel;$('family').onclick=familyPanel;
$('save').onclick=()=>state?slots('save'):toast('请先开启轮回');$('load').onclick=()=>slots('load');$('new').onclick=requestNew;$('modal').addEventListener('cancel',e=>{if(busy||state?.status==='dying')e.preventDefault()});
render();$('journal').innerHTML='<div class="welcome"><div id="cover-art"></div><div class="eyebrow">一卷人生 · 七大纪元 · 自主人生</div><h2>你醒来时，已非昨日</h2><p>没有归途的地图，也没有注定的结局。<br>凭借记忆、胆识与一点气运，<br>在陌生的历史里，活成自己的传奇。</p><p class="talents">原始至20世纪 · 六大区域 · 打工 / 家庭 / 集市</p></div>';$('cover-art').append(engraving({image:'assets/ink_cover.webp',artType:'hourglass',alt:'时空流转'}));if(valid(read('time-drifter-auto'))){const b=document.createElement('button');b.className='option';b.textContent='继续上次旅途 →';b.onclick=()=>restore(read('time-drifter-auto'));$('choices').append(b)}
</script></body></html>
